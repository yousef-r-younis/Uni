                { time: 400.5, event: 'Sensor #3 Arrives', fsm: 'ACTIVE_LOW', power: 800, desc: 'Zero-latency transfer! Data immediately processed' },
                { time: 450, event: 'Transfer Complete', fsm: 'IDLE_LIGHT', power: 50, desc: 'Return to light sleep, waiting for next prediction' },
                { time: 500, event: 'Sensor #4', fsm: 'ACTIVE_LOW', power: 800, desc: 'Another predicted transfer with perfect timing' },
            ];

            useEffect(() => {
                let timer;
                if (isPlaying) {
                    timer = setInterval(() => {
                        setSimulationStep((prev) => (prev + 1) % steps.length);
                    }, 2000);
                }
                return () => clearInterval(timer);
            }, [isPlaying]);

            return (
                <div className="section">
                    <div className="max-w-6xl mx-auto">
                        <h2 className="text-5xl font-bold gradient-text mb-12">Use Case: IoT Sensor Hub Simulation</h2>

                        <div className="card mb-8">
                            <h3 className="text-2xl font-semibold text-white mb-4">Scenario Details</h3>
                            <p className="text-gray-300 leading-relaxed">
                                Battery-powered environmental monitoring device with temperature sensor sending data every 100ms.
                                Traditional DMA would stay in high-power mode or suffer latency from deep sleep. Our intelligent
                                controller learns the pattern and achieves both zero latency AND minimal power consumption.
                            </p>
                        </div>

                        <div className="card mb-8">
                            <div className="flex items-center justify-between mb-6">
                                <h3 className="text-2xl font-semibold text-white">Execution Timeline</h3>
                                <button
                                    onClick={() => setIsPlaying(!isPlaying)}
                                    className="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded text-white font-semibold transition"
                                >
                                    {isPlaying ? '⏸ Pause' : '▶ Play'}
                                </button>
                            </div>

                            {/* Timeline visualization */}
                            <div className="mb-8">
                                <div className="relative h-20 bg-slate-900/50 rounded-lg overflow-hidden">
                                    {steps.map((step, idx) => (
                                        <div
                                            key={idx}
                                            className={`absolute top-0 h-full transition-all duration-500 ${
                                                idx === simulationStep ? 'opacity-100' : 'opacity-30'
                                            }`}
                                            style={{
                                                left: `${(step.time / 500) * 100}%`,
                                                width: '2px',
                                                background: idx === simulationStep ? '#3b82f6' : '#64748b'
                                            }}
                                        >
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                                <div className={`w-4 h-4 rounded-full ${
                                                    idx === simulationStep ? 'bg-blue-500 scale-150' : 'bg-gray-600'
                                                } transition-all`}></div>
                                            </div>
                                        </div>
                                    ))}
                                    {/* Progress indicator */}
                                    <div
                                        className="absolute top-0 h-full bg-blue-500/20 transition-all duration-500"
                                        style={{ width: `${(steps[simulationStep].time / 500) * 100}%` }}
                                    ></div>
                                </div>
                                <div className="flex justify-between text-gray-400 text-sm mt-2">
                                    <span>0ms</span>
                                    <span>100ms</span>
                                    <span>200ms</span>
                                    <span>300ms</span>
                                    <span>400ms</span>
                                    <span>500ms</span>
                                </div>
                            </div>

                            {/* Current step details */}
                            <div className="bg-gradient-to-r from-blue-500/20 to-purple-500/20 border-2 border-blue-500/30 rounded-lg p-6">
                                <div className="grid grid-cols-3 gap-6 mb-4">
                                    <div>
                                        <div className="text-gray-400 text-sm mb-1">Time</div>
                                        <div className="text-2xl font-bold text-white">{steps[simulationStep].time}ms</div>
                                    </div>
                                    <div>
                                        <div className="text-gray-400 text-sm mb-1">FSM State</div>
                                        <div className="text-2xl font-bold text-blue-400">{steps[simulationStep].fsm}</div>
                                    </div>
                                    <div>
                                        <div className="text-gray-400 text-sm mb-1">Power Consumption</div>
                                        <div className="text-2xl font-bold text-green-400">{steps[simulationStep].power}μW</div>
                                    </div>
                                </div>
                                <div className="border-t border-white/10 pt-4">
                                    <div className="text-white font-semibold mb-2">Event: {steps[simulationStep].event}</div>
                                    <div className="text-gray-300">{steps[simulationStep].desc}</div>
                                </div>
                            </div>

                            {/* Step navigator */}
                            <div className="flex justify-center gap-2 mt-6">
                                {steps.map((_, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => { setSimulationStep(idx); setIsPlaying(false); }}
                                        className={`w-3 h-3 rounded-full transition ${
                                            idx === simulationStep ? 'bg-blue-500 scale-125' : 'bg-gray-600 hover:bg-gray-500'
                                        }`}
                                    />
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-6">
                            <div className="card">
                                <h3 className="text-xl font-semibold text-green-400 mb-4">Energy Savings Calculation</h3>
                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between text-gray-300">
                                        <span>Traditional Always-On DMA:</span>
                                        <span className="text-red-400 font-semibold">2000μW avg</span>
                                    </div>
                                    <div className="flex justify-between text-gray-300">
                                        <span>Naive Sleep (high latency):</span>
                                        <span className="text-yellow-400 font-semibold">150μW avg</span>
                                    </div>
                                    <div className="flex justify-between text-gray-300">
                                        <span>Our Intelligent Controller:</span>
                                        <span className="text-green-400 font-semibold">~120μW avg</span>
                                    </div>
                                    <div className="border-t border-white/10 pt-3">
                                        <div className="text-green-400 font-bold text-lg">
                                            94% savings vs. always-on<br/>
                                            20% better than naive sleep<br/>
                                            <span className="text-blue-400">+ ZERO latency penalty</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="card">
                                <h3 className="text-xl font-semibold text-blue-400 mb-4">Model Contributions</h3>
                                <div className="space-y-3 text-sm text-gray-300">
                                    <div>
                                        <div className="text-blue-400 font-semibold">FSM:</div>
                                        Defines state transitions (IDLE_DEEP → IDLE_LIGHT → PREDICTED_READY → ACTIVE_LOW)
                                    </div>
                                    <div>
                                        <div className="text-teal-400 font-semibold">Dataflow:</div>
                                        Models data flow: Sensor → Pattern Analyzer (3 samples) → Predictor → Scheduler → DMA
                                    </div>
                                    <div>
                                        <div className="text-purple-400 font-semibold">Petri Net:</div>
                                        Ensures power budget available, manages channel allocation, prevents resource conflicts
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Conclusion Section
        const ConclusionSection = () => {
            return (
                <div className="section flex items-center justify-center">
                    <div className="max-w-5xl">
                        <h2 className="text-5xl font-bold gradient-text mb-12 text-center">Conclusion & Future Work</h2>

                        <div className="card mb-8">
                            <h3 className="text-2xl font-semibold text-white mb-6">Summary of MoC Analysis</h3>
                            <p className="text-gray-300 text-lg leading-relaxed mb-6">
                                We have formally modeled our Intelligent Energy-Efficient DMA Controller using three complementary
                                Models of Computation. Each model captures essential aspects of the system:
                            </p>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="bg-blue-500/10 p-4 rounded border border-blue-500/20">
                                    <div className="text-blue-400 font-semibold mb-2">FSM</div>
                                    <div className="text-gray-300 text-sm">7 states, 16 transitions modeling power-aware state lifecycle with prediction integration</div>
                                </div>
                                <div className="bg-teal-500/10 p-4 rounded border border-teal-500/20">
                                    <div className="text-teal-400 font-semibold mb-2">Dataflow (SDF)</div>
                                    <div className="text-gray-300 text-sm">7-node pipeline with fixed rates enabling schedulability and buffer analysis</div>
                                </div>
                                <div className="bg-purple-500/10 p-4 rounded border border-purple-500/20">
                                    <div className="text-purple-400 font-semibold mb-2">Petri Net</div>
                                    <div className="text-gray-300 text-sm">13 places, 8 transitions modeling resource contention and concurrency</div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-6 mb-8">
                            <div className="card">
                                <h3 className="text-2xl font-semibold text-white mb-4">Key Achievements</h3>
                                <ul className="text-gray-300 space-y-3">
                                    <li>✅ <strong>Formally verified</strong> deadlock-free operation</li>
                                    <li>✅ <strong>Proven bounded</strong> memory requirements</li>
                                    <li>✅ <strong>Guaranteed throughput</strong> via SDF analysis</li>
                                    <li>✅ <strong>30-50% energy savings</strong> with zero latency penalty</li>
                                    <li>✅ <strong>Novel ML integration</strong> as first-class MoC element</li>
                                </ul>
                            </div>

                            <div className="card">
                                <h3 className="text-2xl font-semibold text-white mb-4">Novel Contributions</h3>
                                <ul className="text-gray-300 space-y-3">
                                    <li>🧠 Prediction state in FSM (ML-aware modeling)</li>
                                    <li>⚡ Energy tokens in Petri Nets (power-aware resources)</li>
                                    <li>📊 Confidence-based dataflow (probabilistic firing)</li>
                                    <li>🔋 Multi-level power states formally integrated</li>
                                    <li>🎯 Cross-model validation framework</li>
                                </ul>
                            </div>
                        </div>

                        <div className="card mb-8">
                            <h3 className="text-2xl font-semibold text-white mb-6">Future Work</h3>
                            <div className="grid grid-cols-2 gap-6">
                                <div>
                                    <h4 className="text-lg font-semibold text-blue-400 mb-3">Part 2: Implementation</h4>
                                    <ul className="text-gray-300 text-sm space-y-2">
                                        <li>• Hardware synthesis from FSM model</li>
                                        <li>• ML prediction engine implementation</li>
                                        <li>• DVFS controller integration</li>
                                        <li>• FPGA prototype development</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="text-lg font-semibold text-teal-400 mb-3">Extended Analysis</h4>
                                    <ul className="text-gray-300 text-sm space-y-2">
                                        <li>• Timed Petri Net for real-time constraints</li>
                                        <li>• Probabilistic dataflow for prediction accuracy</li>
                                        <li>• Hybrid automata for continuous power dynamics</li>
                                        <li>• Model-based testing framework</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div className="text-center">
                            <div className="card inline-block bg-gradient-to-r from-blue-500/20 to-purple-500/20 border-blue-500/30">
                                <h3 className="text-3xl font-bold text-white mb-3">Thank You!</h3>
                                <p className="text-gray-300 text-lg mb-4">Questions & Discussion</p>
                                <div className="text-gray-400">
                                    <div className="mb-2">Moayad Salloum • Yousef Younis</div>
                                    <div className="text-sm">CENG507 - Embedded System Design</div>
                                    <div className="text-sm">Part 1: Models of Computation</div>
                                    <div className="text-sm">January 2026</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [currentSection, setCurrentSection] = useState(0);
            const [scrollProgress, setScrollProgress] = useState(0);
            const scrollContainerRef = useRef(null);

            const sections = [
                <TitleSlide key="title" />,
                <DMAIntroSection key="dma-intro" />,
                <SystemOverviewSection key="overview" />,
                <FSMSection key="fsm" />,
                <DataflowSection key="dataflow" />,
                <PetriNetSection key="petri" />,
                <IntegrationSection key="integration" />,
                <UseCaseSection key="usecase" />,
                <ConclusionSection key="conclusion" />,
            ];

            useEffect(() => {
                const handleScroll = () => {
                    if (scrollContainerRef.current) {
                        const { scrollTop, scrollHeight, clientHeight } = scrollContainerRef.current;
                        const progress = (scrollTop / (scrollHeight - clientHeight)) * 100;
                        setScrollProgress(progress);

                        const sectionIndex = Math.round(scrollTop / clientHeight);
                        setCurrentSection(sectionIndex);
                    }
                };

                const container = scrollContainerRef.current;
                if (container) {
                    container.addEventListener('scroll', handleScroll);
                    return () => container.removeEventListener('scroll', handleScroll);
                }
            }, []);

            const navigateToSection = (index) => {
                if (scrollContainerRef.current) {
                    const { clientHeight } = scrollContainerRef.current;
                    scrollContainerRef.current.scrollTo({
                        top: index * clientHeight,
                        behavior: 'smooth'
                    });
                }
            };

            return (
                <>
                    <div className="progress-bar" style={{ width: `${scrollProgress}%` }} />
                    <Navigation
                        currentSection={currentSection}
                        totalSections={sections.length}
                        onNavigate={navigateToSection}
                    />
                    <div ref={scrollContainerRef} className="scroll-container">
                        {sections}
                    </div>
                </>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Study Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --accent3: #ff6b47;
    --text: #e8e8f0;
    --muted: #555570;
    --done: #2a2a3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 32px 20px;
    background-image:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(232,255,71,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% 80%, rgba(71,200,255,0.04) 0%, transparent 60%);
  }

  .header {
    max-width: 900px;
    margin: 0 auto 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .header-left h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .header-left h1 span { color: var(--accent); }

  .header-left p {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .global-progress {
    text-align: right;
  }

  .global-progress .big-num {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
  }

  .global-progress .big-num span {
    font-size: 20px;
    color: var(--muted);
    font-weight: 400;
  }

  .global-progress p {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .tabs {
    max-width: 900px;
    margin: 0 auto 28px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 700; }

  .main {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    gap: 20px;
  }

  /* TRACKER VIEW */
  .course-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .course-card:hover { border-color: #2e2e4e; }

  .course-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .course-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .course-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .course-stats {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .course-frac {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .course-pct {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    width: 100%;
  }

  .progress-bar-fill {
    height: 100%;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .lectures {
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .lect-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
    min-width: 110px;
  }

  .lect-btn:hover {
    border-color: #3e3e5e;
    background: rgba(255,255,255,0.03);
  }

  .lect-btn.done {
    background: rgba(232,255,71,0.07);
    border-color: rgba(232,255,71,0.25);
    color: var(--accent);
  }

  .lect-btn.done .check { color: var(--accent); }

  .check {
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .lect-btn.done .check {
    border-color: var(--accent);
    background: rgba(232,255,71,0.2);
  }

  .lect-note {
    font-size: 9px;
    color: var(--muted);
    font-style: italic;
    margin-left: 2px;
  }

  /* SCHEDULE VIEW */
  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .day-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .day-name {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .day-date {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .day-slots {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slot {
    padding: 8px 10px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: opacity 0.15s;
    border: 1px solid transparent;
  }

  .slot:hover { opacity: 0.85; }

  .slot.done-slot {
    opacity: 0.45;
    text-decoration: line-through;
  }

  .slot-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .slot-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    line-height: 1.3;
  }

  .slot-label small {
    display: block;
    font-size: 9px;
    opacity: 0.6;
    margin-top: 1px;
  }

  .today-badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    background: var(--accent);
    color: #0a0a0f;
    padding: 2px 6px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .deadline-card {
    background: linear-gradient(135deg, rgba(255,107,71,0.08), rgba(255,107,71,0.03));
    border: 1px solid rgba(255,107,71,0.3);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .deadline-card p { font-size: 13px; font-weight: 600; }
  .deadline-card span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent3);
  }

  .empty-day {
    padding: 10px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>

<script>
const COURSES = [
  {
    id: 'ml_lab',
    name: 'ML Lab',
    color: '#e8ff47',
    lectures: [
      { id: 'ml_lab_1', label: 'Lect 1' },
      { id: 'ml_lab_2', label: 'Lect 2' },
      { id: 'ml_lab_3', label: 'Lect 3' },
      { id: 'ml_lab_4', label: 'Lect 4' },
    ]
  },
  {
    id: 'ml',
    name: 'Machine Learning',
    color: '#47c8ff',
    lectures: [
      { id: 'ml_1', label: 'Lect 1' },
      { id: 'ml_2', label: 'Lect 2' },
      { id: 'ml_3', label: 'Lect 3' },
      { id: 'ml_4', label: 'Lect 4', note: '→ slide 12' },
    ]
  },
  {
    id: 'ana',
    name: 'Adv. Network Arch.',
    color: '#b47fff',
    lectures: [
      { id: 'ana_1', label: 'Lect 1' },
      { id: 'ana_2', label: 'Lect 2' },
      { id: 'ana_3', label: 'Lect 3' },
    ]
  },
  {
    id: 'mmn',
    name: 'Multimedia Networks',
    color: '#ff9f47',
    lectures: [
      { id: 'mmn_1', label: 'Lect 1', done: true },
      { id: 'mmn_2', label: 'Lect 2', done: true },
      { id: 'mmn_3', label: 'Lect 3', done: true },
      { id: 'mmn_4', label: 'Lect 4' },
    ]
  },
  {
    id: 'wc',
    name: 'Wireless Comm.',
    color: '#ff6b6b',
    lectures: [
      { id: 'wc_1', label: 'Lect 1' },
      { id: 'wc_2', label: 'Lect 2' },
      { id: 'wc_3', label: 'Lect 3' },
    ]
  }
];

// Load state from localStorage
function loadState() {
  try {
    return JSON.parse(localStorage.getItem('study_tracker_v1') || '{}');
  } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem('study_tracker_v1', JSON.stringify(state));
}

// Build initial state from preset done lectures
let state = loadState();
COURSES.forEach(c => c.lectures.forEach(l => {
  if (l.done && !(l.id in state)) state[l.id] = true;
}));

// Generate schedule: spread 14 lectures over Mar 14–21 (8 days)
// All undone lectures get assigned a day
function buildSchedule() {
  const days = [];
  for (let i = 0; i < 8; i++) {
    const d = new Date(2026, 2, 14 + i); // March 14-21
    days.push({ date: d, slots: [] });
  }

  // Collect all lectures in priority order
  const allLectures = [];
  COURSES.forEach(c => c.lectures.forEach(l => {
    allLectures.push({ ...l, courseId: c.id, courseName: c.name, color: c.color });
  }));

  // Distribute evenly, 2 per day roughly (14 total / 8 days)
  // Already done ones still shown in schedule but marked
  let idx = 0;
  allLectures.forEach((lect, i) => {
    const dayIdx = Math.min(Math.floor(i * 8 / allLectures.length), 7);
    days[dayIdx].slots.push(lect);
  });

  return days;
}

const schedule = buildSchedule();

function toggle(id) {
  state[id] = !state[id];
  saveState(state);
  render();
}

function totalDone() {
  let done = 0, total = 0;
  COURSES.forEach(c => c.lectures.forEach(l => {
    total++;
    if (state[l.id]) done++;
  }));
  return { done, total };
}

function setView(v) {
  currentView = v;
  render();
}

let currentView = 'tracker';

function render() {
  const app = document.getElementById('app');
  const { done, total } = totalDone();
  const pct = Math.round(done / total * 100);

  const today = new Date(2026, 2, 14);
  const deadlineDate = new Date(2026, 2, 22);
  const daysLeft = Math.ceil((deadlineDate - today) / 86400000);

  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <h1>Week <span>4</span> Sprint</h1>
        <p>Deadline: 22 March 2026 · ${daysLeft} days left</p>
      </div>
      <div class="global-progress">
        <div class="big-num">${done}<span>/${total}</span></div>
        <p>${pct}% complete</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${currentView === 'tracker' ? 'active' : ''}" onclick="setView('tracker')">📋 Tracker</button>
      <button class="tab ${currentView === 'schedule' ? 'active' : ''}" onclick="setView('schedule')">📅 Schedule</button>
    </div>

    <div class="main">
      ${currentView === 'tracker' ? renderTracker() : renderSchedule()}
    </div>
  `;
}

function renderTracker() {
  return COURSES.map(c => {
    const doneLects = c.lectures.filter(l => state[l.id]).length;
    const pct = Math.round(doneLects / c.lectures.length * 100);
    return `
      <div class="course-card">
        <div class="course-header">
          <div class="course-name">
            <div class="course-dot" style="background:${c.color}"></div>
            ${c.name}
          </div>
          <div class="course-stats">
            <span class="course-frac">${doneLects}/${c.lectures.length}</span>
            <span class="course-pct" style="color:${c.color}">${pct}%</span>
          </div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%;background:${c.color}"></div>
        </div>
        <div class="lectures">
          ${c.lectures.map(l => `
            <button class="lect-btn ${state[l.id] ? 'done' : ''}" onclick="toggle('${l.id}')">
              <div class="check">${state[l.id] ? '✓' : ''}</div>
              ${l.label}
              ${l.note ? `<span class="lect-note">${l.note}</span>` : ''}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderSchedule() {
  const today = new Date(2026, 2, 14);
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr'];

  const { done, total } = totalDone();
  const remaining = total - done;

  return `
    <div class="deadline-card">
      <p>⚡ ${remaining} lectures remaining · Deadline 22 March</p>
      <span>8 days · ~${Math.ceil(remaining/8)} per day</span>
    </div>
    <div class="schedule-grid">
      ${schedule.map((day, i) => {
        const isToday = day.date.toDateString() === today.toDateString();
        const isPast = day.date < today;
        const dateStr = `${dayNames[day.date.getDay()]} ${day.date.getDate()} Mar`;
        return `
          <div class="day-card" style="${isPast && !isToday ? 'opacity:0.6' : ''}">
            <div class="day-header">
              <div class="day-name" style="${isToday ? 'color:var(--accent)' : ''}">
                ${dayNames[day.date.getDay()]} ${day.date.getDate()}
                ${isToday ? ' <span class="today-badge">TODAY</span>' : ''}
              </div>
              <div class="day-date">Mar 2026</div>
            </div>
            <div class="day-slots">
              ${day.slots.length === 0
                ? `<div class="empty-day">Rest day</div>`
                : day.slots.map(slot => {
                  const isDone = state[slot.id];
                  const course = COURSES.find(c => c.id === slot.courseId);
                  return `
                    <div class="slot ${isDone ? 'done-slot' : ''}" 
                         style="background:${course.color}18; border-color:${course.color}22"
                         onclick="toggle('${slot.id}'); event.stopPropagation()">
                      <div class="slot-dot" style="background:${course.color}"></div>
                      <div class="slot-label">
                        ${slot.label}${slot.note ? ` <span style="opacity:0.6">${slot.note}</span>` : ''}
                        <small>${course.name}</small>
                      </div>
                    </div>
                  `;
                }).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  document.body.innerHTML = '<div id="app"></div>';
  render();
});
</script>

<div id="app"></div>

</body>
</html>
